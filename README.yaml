github_repo: cloudopsworks/terraform-module-aws-mssql-management

description: |-
  A comprehensive Terraform module for managing AWS MSSQL (Microsoft SQL Server) databases, users, roles, and permissions. This module provides automated MSSQL user and database management with integrated AWS Secrets Manager support, password rotation capabilities, and optional Hoop.dev integration for secure database access.

# Introduction to the project
introduction: |-
  This Terraform module simplifies AWS MSSQL database management by providing a declarative approach to:
  
  - **Database Management**: Create and configure MSSQL databases with custom collations
  - **Schema Management**: Declare schemas per database, with optional schema owners
  - **User Management**: Automated user creation with different permission levels (owner, readwrite, readonly)
  - **Multi-Database Users**: A single login assigned to any number of databases, with grants applied in each
  - **Role Management**: Flexible role-based access control with granular permissions
  - **Security Integration**: AWS Secrets Manager integration for secure credential storage
  - **Secret Lifecycle Controls**: Recovery windows, cross-region replication, and import of existing secrets
  - **Password Compatibility**: Optional alphanumeric-only generated passwords
  - **Password Rotation**: Automated password rotation with Lambda function support
  - **Access Control**: Hoop.dev integration for secure, audited database access
  - **Multi-Environment Support**: Hub and spoke architecture support for complex deployments

  The module supports both RDS instances and Aurora clusters, with optional direct connection capabilities for existing database infrastructures.

# How to use this project
usage: |-
  ## Terragrunt Usage

  To use this module with Terragrunt, define your `terragrunt.hcl` as follows:

  ```hcl
  terraform {
    source = "git::https://github.com/cloudopsworks/terraform-module-aws-mssql-management.git?ref=v1.4.0"
  }

  inputs = {
    # Organization configuration
    org = {
      organization_name = "mycompany"
      organization_unit = "platform"
      environment_type  = "dev"
      environment_name  = "development"
    }
    
    # Database configuration
    databases = {
      app_db = {
        name              = "application_db"
        default_collation = "SQL_Latin1_General_CP1_CI_AS"
      }
    }
    
    # User configuration
    users = {
      app_user = {
        name   = "app_user"
        grant  = "readwrite"
        db_ref = "app_db"
      }
    }
  }
  ```

  ## Configuration Variables Documentation

  ### Users (`users` variable)
  | Field | Type | Required/Optional | Description |
  |-------|------|-------------------|-------------|
  | `name` | `string` | **Required** | Name of the user |
  | `grant` | `string` | **Required** | Grant type: `owner`, `readwrite`, `readonly` |
  | `db_ref` | `string` | Optional | Database in `databases` this user is created in; becomes the default database |
  | `db_refs` | `list(string)` | Optional | Every database in `databases` this user is created in (default: `[]`) |
  | `database_id` | `string` | Optional | Direct ID of a database not declared in `databases`; takes precedence over `db_ref` as the default |
  | `database_ids` | `list(string)` | Optional | Direct IDs of every undeclared database this user is created in (default: `[]`) |
  | `database_name` | `string` | Optional | Database name recorded in the secret when the user is attached by `database_id` only |
  | `schema` | `string` | Optional | Schema the `readonly`/`readwrite` grant applies to (default: `dbo`) |
  | `schemas` | `list(string)` | Optional | Additional schemas granted, in every assigned database (default: `[]`) |
  | `connection_string_type` | `string` | Optional | Emit a connection string in the secret: `jdbc`, `jdbc_plain`, `dotnet`, `odbc`, `node`, `gomssql` |
  | `default_language` | `string` | Optional | Default language for the user |
  | `check_password_expiration` | `bool` | Optional | Check password expiration (default: `false`) |
  | `check_password_policy` | `bool` | Optional | Check password policy (default: `false`) |
  | `must_change_password` | `bool` | Optional | Must change password on first login (default: `false`) |
  | `secret.import` | `bool` | Optional | Import the existing Secrets Manager secret (default: `false`) |
  | `secret.recovery_window` | `number` | Optional | Override the module recovery window with 0 or 7-30 days |
  | `secret.replica.region` | `string` | Optional | Override the replica region for this secret |
  | `secret.replica.kms_key_id` | `string` | Optional | Override the KMS key in the replica region |

  #### Full YAML Documentation
  ```yaml
  users:
    <user_ref>:
      name: "user_name"                      # (Required) Name of the user
      grant: "owner"                         # (Required) Grant type for the user. Possible values: owner, readwrite, readonly
      db_ref: "db_reference"                 # (Optional) Database in `databases` this user is created in; becomes the default database
      db_refs:                               # (Optional) Every database in `databases` this user is created in. Defaults to []
        - "db_reference"
      database_id: "db_id"                   # (Optional) Direct ID of a database not in `databases`; takes precedence over db_ref as the default
      database_ids:                          # (Optional) Direct IDs of every undeclared database this user is created in. Defaults to []
        - "db_id"
      database_name: "db_name"               # (Optional) Database name recorded in the secret when attached by database_id only
      schema: "dbo"                          # (Optional) Schema the readonly/readwrite grant applies to. Defaults to dbo
      schemas:                               # (Optional) Additional schemas granted, in every assigned database. Defaults to []
        - "app"
      connection_string_type: "jdbc"         # (Optional) Connection string flavour stored in the secret: jdbc, jdbc_plain, dotnet, odbc, node, gomssql
      default_language: "English"            # (Optional) Default language for the user
      check_password_expiration: false       # (Optional) Check password expiration. Defaults to false
      check_password_policy: false           # (Optional) Check password policy. Defaults to false
      must_change_password: false            # (Optional) Must change password on first login. Defaults to false
      secret:
        import: false                        # (Optional) Import the existing Secrets Manager secret
        recovery_window: 30                  # (Optional) 0 or 7-30 days
        replica:
          region: "us-west-2"                # (Optional) Cross-region replica
          kms_key_id: "alias/replica-key"    # (Optional) KMS key in the replica region
  ```

  ### Schemas, Multi-Database Users and Global Owners

  #### Schemas

  Schemas are declared per database under `databases.<db_ref>.schemas`, either as a
  bare name or as an object with an owner:

  ```yaml
  databases:
    app_db:
      name: "application_db"
      schemas:
        - "app"
        - name: "reporting"
          owner_ref: "analyst"   # a user in `users`, assigned to this database
  ```

  `dbo` is created by SQL Server with every database and is the default schema for
  principals; `guest`, `sys` and `information_schema` are built in as well. The
  module never creates any of them - declaring one is accepted and simply resolves
  to the existing schema, so `schema: "dbo"` on a user keeps working.

  Schemas created in the same run are resolvable in that run: the schema map merges
  the schemas read from the server with the ones this module creates, so a user can
  be granted on a schema declared in the same apply.

  #### Multi-database users

  A user always has one server-level login and one database user per database it is
  assigned to. Grants (`owner`, `readwrite`, `readonly`) are applied in **every**
  assigned database, across every schema in the user's schema list.

  Databases resolve in this order, and the first one is the **default**: it sets the
  login's default database, the name of the Secrets Manager secret and the `dbname`
  stored inside it.

  | Order | Attribute | Notes |
  |-------|-----------|-------|
  | 1 | `database_id` | Single, undeclared database. Highest precedence |
  | 2 | `db_ref` | Single, declared database |
  | 3 | `database_ids` | List, undeclared databases |
  | 4 | `db_refs` | List, declared databases |

  `db_ref` and `database_id` are the pre-multi-database attributes and behave
  exactly as before; they now simply denote the first database. A user may reference
  each database only once across all four attributes.

  ```yaml
  users:
    reporting_user:
      name: "reporting_user"
      grant: "readonly"
      db_refs:                 # created in all three; app_db is the default
        - "app_db"
        - "billing_db"
        - "archive_db"
      schemas:                 # granted on both schemas in each of them
        - "dbo"
        - "reporting"
  ```

  #### Global owners

  Setting `global_owner: true` on a database that also has `create_owner: true`
  promotes that owner to `db_owner` of **every** database declared in `databases`,
  so a single credential administers all of them. The owner login, its password
  rotation and its Secrets Manager secret stay attached to the database that
  declares it.

  ```yaml
  databases:
    app_db:
      name: "application_db"
      create_owner: true
      global_owner: true       # owner of application_db is db_owner everywhere
    billing_db:
      name: "billing_db"
    archive_db:
      name: "archive_db"
      create: false            # pre-existing database, still gets the global owner
  ```

  ### Databases (`databases` variable)
  | Field | Type | Required/Optional | Description |
  |-------|------|-------------------|-------------|
  | `name` | `string` | **Required** | Name of the database |
  | `create` | `bool` | Optional | Whether to create the database (default: `true`) |
  | `create_owner` | `bool` | Optional | If the database should be created with an owner (default: `false`) |
  | `global_owner` | `bool` | Optional | Make this database's owner a `db_owner` of **every** declared database; requires `create_owner` (default: `false`) |
  | `owner` | `string` | Optional | Owner of the database, required if `create_owner` is false |
  | `schemas` | `list(any)` | Optional | Schemas created in the database, as names or `{ name, owner_ref }` objects (default: `[]`) |
  | `default_collation` | `string` | Optional | Collation of the database |
  | `default_language` | `string` | Optional | Default language for the owner user |
  | `check_password_expiration` | `bool` | Optional | Check password expiration for owner (default: `false`) |
  | `check_password_policy` | `bool` | Optional | Check password policy for owner (default: `false`) |
  | `must_change_password` | `bool` | Optional | Must change password for owner (default: `false`) |
  | `secret.import` | `bool` | Optional | Import the existing owner secret (default: `false`) |
  | `secret.recovery_window` | `number` | Optional | Override the module recovery window with 0 or 7-30 days |
  | `secret.replica.region` | `string` | Optional | Override the replica region for the owner secret |
  | `secret.replica.kms_key_id` | `string` | Optional | Override the KMS key in the replica region |

  #### Full YAML Documentation
  ```yaml
  databases:
    <db_ref>:
      name: "db_name"                        # (Required) Name of the database
      create: true                           # (Optional) Whether to create the database. Defaults to true
      create_owner: false                    # (Optional) If the database should be created with an owner. Defaults to false
      global_owner: false                    # (Optional) Make this owner a db_owner of every declared database. Requires create_owner. Defaults to false
      owner: "owner_name"                    # (Optional) Owner of the database, required if create_owner is false
      schemas:                               # (Optional) Schemas to create in this database. Defaults to []
        - "app"                              #            Shorthand form: the schema name
        - name: "reporting"                  #            (Required) Schema name
          owner_ref: "user_ref"              #            (Optional) User in `users` owning the schema; must be assigned to this database
      default_collation: "SQL_Latin1_General_CP1_CI_AS" # (Optional) Collation of the database. Defaults to server default
      default_language: "English"            # (Optional) Default language for the owner user
      check_password_expiration: false       # (Optional) Check password expiration for owner. Defaults to false
      check_password_policy: false           # (Optional) Check password policy for owner. Defaults to false
      must_change_password: false            # (Optional) Must change password for owner on first login. Defaults to false
      secret:
        import: false                        # (Optional) Import the existing owner secret
        recovery_window: 30                  # (Optional) 0 or 7-30 days
        replica:
          region: "us-west-2"                # (Optional) Cross-region replica
          kms_key_id: "alias/replica-key"    # (Optional) KMS key in the replica region
  ```

  ### Roles (`roles` variable)
  | Field | Type | Required/Optional | Description |
  |-------|------|-------------------|-------------|
  | `name` | `string` | **Required** | Name of the role |
  | `db_ref` | `string` | Optional | Reference to the database |
  | `database_name` | `string` | Optional | Name of the database |
  | `table_name` | `string` | Optional | Name of the table (default: `*`) |
  | `grant_option` | `bool` | Optional | If the role has grant option (default: `false`) |
  | `grants` | `list(string)` | Optional | Grants for the role (default: `ALL PRIVILEGES`) |

  #### Full YAML Documentation
  ```yaml
  roles:
    <role_ref>:
      name: "role_name"                      # (Required) Name of the role
      db_ref: "db_reference"                 # (Optional) Reference to the database this role is associated with. Defaults to the default dbname of server
      database_name: "db_name"               # (Optional) Name of the database this role is associated with. Defaults to the default dbname of server
      table_name: "table_name"               # (Optional) Name of the table this role is associated with. Defaults to `*`
      grant_option: false                    # (Optional) If the role has grant option. Defaults to false
      grants:                                # (Optional) Grants for the role. Defaults to ALL PRIVILEGES
        - "SELECT"
  ```

  ### RDS Integration (`rds` variable)
  | Field | Type | Required/Optional | Description |
  |-------|------|-------------------|-------------|
  | `enabled` | `bool` | Optional | Enable RDS integration (default: `false`) |
  | `name` | `string` | **Required if enabled** | RDS instance or cluster name |
  | `secret_name` | `string` | **Required if enabled** | Secrets Manager secret name |
  | `cluster` | `bool` | Optional | If it's an Aurora cluster (default: `false`) |
  | `from_secret` | `bool` | Optional | Read all connection details from secret (default: `false`) |
  | `server_name` | `string` | Optional | Override logical server name |

  #### Full YAML Documentation
  ```yaml
  rds:
    enabled: false                           # (Optional) If the RDS should be enabled. Defaults to false
    name: "rds_instance_id"                  # (Optional) Name of the RDS instance or cluster. Required if enabled is true
    secret_name: "secret_path"               # (Optional) Name of the AWS Secrets Manager secret. Required if enabled is true
    cluster: false                           # (Optional) If the RDS is an Aurora RDS Cluster. Defaults to false
    from_secret: false                       # (Optional) Read all connection details from secret. Defaults to false
    server_name: "logical_name"              # (Optional) Override server logical name
  ```

  ### Hoop.dev Integration (`hoop` variable)
  | Field | Type | Required/Optional | Description |
  |-------|------|-------------------|-------------|
  | `enabled` | `bool` | Optional | Enable Hoop integration (default: `false`) |
  | `agent` | `string` | **Required if enabled** | Hoop agent name |
  | `connection_name` | `string` | Optional | Hoop connection name |
  | `db_name` | `string` | Optional | Database name for Hoop |
  | `engine` | `string` | Optional | Engine for Hoop (`sqlserver`) |
  | `server_name` | `string` | Optional | Logical server name |
  | `cluster` | `bool` | Optional | If it's a cluster |
  | `port` | `number` | Optional | Local tunnel port (default: `1433`) |
  | `tags` | `list(string)` | Optional | Tags for Hoop resource (`tag=value`) |

  #### Full YAML Documentation
  ```yaml
  hoop:
    enabled: false                           # (Optional) If the hoop should be enabled. Defaults to false
    agent: "agent_name"                      # (Optional) Name of the hoop agent. Required if enabled is true
    connection_name: "conn_name"             # (Optional) Name of the hoop connection.
    db_name: "sqlserver"                     # (Optional) Database name for hoop connection
    engine: "sqlserver"                     # (Optional) Engine for hoop connection
    server_name: "server_name"               # (Optional) Logical server name
    cluster: false                           # (Optional) If it's a cluster
    port: 1433                               # (Optional) Port for local tunnel. Defaults to 1433
    username: "user"                         # (Optional) Username for local tunnel
    password: "pass"                         # (Optional) Password for local tunnel
    tags:                                    # (Optional) Tags to apply to the hoop. format <tagname>=<tagvalue>
      - "tag=value"
  ```

  ### Direct Connection (`direct` variable)
  | Field | Type | Required/Optional | Description |
  |-------|------|-------------------|-------------|
  | `server_name` | `string` | **Required** | Logical server name |
  | `host` | `string` | **Required** | Database host address |
  | `port` | `number` | **Required** | Database port |
  | `jump_host` | `string` | Optional | Jump host address |
  | `jump_port` | `number` | Optional | Jump host port |
  | `username` | `string` | Optional | Database username |
  | `password` | `string` | Optional | Database password |
  | `secret_name` | `string` | Optional | Secrets Manager secret name |
  | `engine` | `string` | Optional | Database engine (default: `sqlserver`) |
  | `db_name` | `string` | Optional | Default database name |

  #### Full YAML Documentation
  ```yaml
  direct:
    server_name: "server"                    # (Required) Logical server name
    host: "host_address"                     # (Required) Database host address
    port: 1433                               # (Required) Database port
    jump_host: "jump_host"                   # (Optional) Jump host address
    jump_port: 22                            # (Optional) Jump host port
    username: "admin"                        # (Optional) Database username
    password: "password"                     # (Optional) Database password
    secret_name: "secret_path"               # (Optional) AWS Secrets Manager secret name for credentials
    engine: "sqlserver"                     # (Optional) Database engine. Defaults to sqlserver
    db_name: "master"                        # (Optional) Default database name
  ```

  ### Other Variables
  | Variable | Type | Default | Description |
  |----------|------|---------|-------------|
  | `password_rotation_period` | `number` | `90` | Password rotation period in days |
  | `run_hoop` | `bool` | `false` | Run hoop with agent via null_resource |
  | `secrets_kms_key_id` | `string` | `null` | KMS Key ID for Secrets Manager encryption |
  | `secrets_recovery_window` | `number` | `30` | Default secret deletion recovery window; 0 or 7-30 days |
  | `secrets_replica_region` | `string` | `null` | Default cross-region replica region |
  | `secrets_replica_kms_key_id` | `string` | `null` | Default KMS key in the replica region |
  | `rotation_lambda_name` | `string` | `""` | Name of the rotation lambda function |
  | `rotation_duration` | `string` | `"1h"` | Rotation lambda duration |
  | `rotate_immediately` | `bool` | `false` | Rotate password immediately |
  | `force_reset` | `bool` | `false` | Force Reset the password |
  | `specials_in_password` | `bool` | `true` | Include supported special characters in generated passwords |

# Example usage
examples: |-
  ## Example: Standard MSSQL with RDS

  ```hcl
  inputs = {
    org = {
      organization_name = "acme-corp"
      organization_unit = "backend"
      environment_type  = "production"
      environment_name  = "prod"
    }
    
    databases = {
      app_db = {
        name = "ecommerce"
      }
    }
    
    users = {
      app_user = {
        name   = "ecommerce_api"
        grant  = "readwrite"
        db_ref = "app_db"
      }
      readonly_user = {
        name   = "reporting_user"
        grant  = "readonly"
        db_ref = "app_db"
      }
    }
    
    rds = {
      enabled     = true
      name        = "ecommerce-mssql"
      secret_name = "prod/ecommerce/mssql"
    }
  }
  ```

  ## Example: Schemas, a multi-database user and a global owner

  ```hcl
  inputs = {
    org = {
      organization_name = "acme-corp"
      organization_unit = "backend"
      environment_type  = "production"
      environment_name  = "prod"
    }

    databases = {
      app_db = {
        name         = "ecommerce"
        create_owner = true
        global_owner = true          # this owner is db_owner of all three databases
        schemas = [
          "app",
          {
            name      = "reporting"
            owner_ref = "analytics"  # owned by the analytics user below
          },
        ]
      }
      billing_db = {
        name    = "billing"
        schemas = ["app"]
      }
      archive_db = {
        name   = "archive"
        create = false               # pre-existing, still gets the global owner
      }
    }

    users = {
      # Written access to app + dbo in all three databases. The secret records
      # ecommerce, the first entry of db_refs.
      etl = {
        name    = "etl_service"
        grant   = "readwrite"
        db_refs = ["app_db", "billing_db", "archive_db"]
        schemas = ["app", "dbo"]
      }

      # Read-only on the reporting schema it owns.
      analytics = {
        name   = "analytics_reader"
        grant  = "readonly"
        db_ref = "app_db"
        schema = "reporting"
      }
    }

    rds = {
      enabled     = true
      name        = "ecommerce-mssql"
      secret_name = "prod/ecommerce/mssql"
    }
  }
  ```


# How to get started quickly
quickstart: |-
  ## Quick Start with Terragrunt

  ### 1. Create `terragrunt.hcl`
  ```hcl
  terraform {
    source = "git::https://github.com/cloudopsworks/terraform-module-aws-mssql-management.git?ref=v1.4.0"
  }

  inputs = {
    org = {
      organization_name = "quickstart"
      organization_unit = "development"
      environment_type  = "development"
      environment_name  = "dev"
    }

    databases = {
      test_db = {
        name = "test_database"
      }
    }

    users = {
      test_user = {
        name   = "test_user"
        grant  = "readwrite"
        db_ref = "test_db"
      }
    }

    rds = {
      enabled     = true
      name        = "test-mssql-instance"
      secret_name = "dev/test/mssql"
    }
  }
  ```

  ### 2. Deploy
  ```bash
  terragrunt init
  terragrunt plan
  terragrunt apply
  ```

